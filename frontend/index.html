<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ЛЦТ Команда "Мечты"</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="page-shell landing-shell">
      <header class="hero landing-hero">
        <div class="hero-content hero-content-compact">
          <p class="eyebrow">Лидеры цифровой трансформации 2026 - команда "Мечты"</p>
          <h1>Здравствуйте!</h1>
          <p class="subtitle">Выберите необходимое действие:</p>
        </div>
      </header>

      <main class="main-content landing-grid">
        <button class="landing-card" type="button" data-route="/replenishment">
          <img src="/static/images/popolnenie_bd.png" alt="Пополнение базы данных" />
          <span>Пополнение базы данных</span>
        </button>

        <button class="landing-card" type="button" data-route="/solo">
          <img src="/static/images/ocr_machine.png" alt="Распознавание машины solo" />
          <span>Распознавание машины (одиночное)</span>
        </button>

        <button class="landing-card" type="button" data-route="/many">
          <img src="/static/images/multi_identification.png" alt="Распознавание машины multi" />
          <span>Распознавание машин (массовое)</span>
        </button>
      </main>

      <section class="panel landing-panel" id="historyPanel">
        <div class="section-header">
          <h2>История запросов</h2>
        </div>
        <div id="requestsList" class="requests-list"></div>
      </section>
    </div>

    <script src="/static/app.js?v=20260926-1"></script>
  </body>
</html>
