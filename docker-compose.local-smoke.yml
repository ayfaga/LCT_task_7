# Reuses previously built local images when Docker Hub is unavailable.
# This is a smoke harness, not the release build proof.
services:
  ml:
    image: lct_task_7-ml:latest
    working_dir: /app
    command: ["sh", "-c", "python artifact_preflight.py && exec uvicorn app.ml.api:app --host 0.0.0.0 --port 8001 --workers 1"]
    environment:
      LCT_ML_ARTIFACT_DIR: /model
      LCT_ML_GALLERY_PATH: ""
      LCT_ML_GALLERY_DB_PATH: /gallery_state/gallery.sqlite3
      LCT_ML_USER_GALLERY_DIR: /gallery_state
      LCT_ML_DEVICE: cpu
    volumes:
      - ./backend:/app:ro
      - ./model_artifacts/joint_l336:/model:ro
      - smoke_gallery_state:/gallery_state
    ports:
      - "127.0.0.1:18021:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=30)"]
      interval: 10s
      timeout: 45s
      retries: 6

  backend:
    image: lct_task_7-backend:latest
    working_dir: /app/backend
    environment:
      DATABASE_URL: sqlite:////state/local.db
      LCT_ML_SERVICE_URL: http://ml:8001
      LCT_UPLOAD_DIR: /state/uploads
      LCT_GALLERY_STATE_DIR: /gallery_state
    volumes:
      - ./backend:/app/backend:ro
      - ./frontend:/app/frontend:ro
      - smoke_backend_state:/state
      - smoke_gallery_state:/gallery_state
    ports:
      - "127.0.0.1:18020:8000"
    depends_on:
      ml:
        condition: service_healthy

volumes:
  smoke_gallery_state:
  smoke_backend_state:
